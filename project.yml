name: IronSplits
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.jackwallner
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  IronSplits:
    type: application
    platform: iOS
    sources:
      - path: IronSplits
      - path: Shared
    resources:
      - path: IronSplits/PrivacyInfo.xcprivacy
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.ironman
        PRODUCT_NAME: "IM Tri Tracker"
        PRODUCT_MODULE_NAME: IM_Iron_Splits
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: IronSplits/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          # Temporary TestFlight review switch. Remove this condition and the
          # matching ProGate branch before enabling paid Race Book access.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RACE_BOOK_TEST_UNLOCK"
    dependencies:
      - package: RevenueCat

  IronSplitsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IronSplitsTests
    dependencies:
      - target: IronSplits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IM Tri Tracker.app/IM Tri Tracker"

  IronSplitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IronSplitsUITests
    dependencies:
      - target: IronSplits
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IronSplits

schemes:
  IronSplits:
    build:
      targets:
        IronSplits: all
    run:
      config: Debug
      storeKitConfiguration: IronSplits/Services/Products.storekit
    # XcodeGen can only put the StoreKit configuration on the run action; the
    # test action needs it too, and `scripts/generate.sh` patches it in.
    test:
      config: Debug
      targets:
        - IronSplitsTests
        - IronSplitsUITests
      gatherCoverageData: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
